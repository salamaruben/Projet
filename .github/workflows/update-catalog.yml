name: Mise à jour du catalogue
on:
  schedule:
    - cron: "17 4 * * *" # tous les jours
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update_catalog.mjs
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      - name: Commit
        run: |
          git config user.name "catalog-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/catalog.json
          git diff --cached --quiet || git commit -m "Mise à jour du catalogue"
          git push
